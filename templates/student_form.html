{% extends "base.html" %}
{% block title %}{{ 'Edit' if s else 'Add' }} student{% endblock %}
{% block content %}
<div class="col-lg-6">
<h3>{{ 'Edit student' if s else 'Add student' }}</h3>
<form method="post" class="card card-body">
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label">Roll number</label><input name="roll_no" class="form-control" value="{{ s.roll_no if s }}" required></div>
    <div class="col-md-6"><label class="form-label">Full name</label><input name="name" class="form-control" value="{{ s.name if s }}" required></div>
    <div class="col-md-6"><label class="form-label">Department</label><input name="dept" class="form-control" value="{{ s.dept if s }}" placeholder="CSE" required></div>
    <div class="col-md-6"><label class="form-label">Year</label><select name="year" class="form-select">{% for y in [1,2,3,4] %}<option {{ 'selected' if s and s.year==y }}>{{ y }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control" value="{{ s.email if s }}"></div>
    <div class="col-md-6"><label class="form-label">Phone</label><input name="phone" class="form-control" value="{{ s.phone if s }}"></div>
  </div>
  {% if not s %}<div class="form-text mt-3">A student login is created automatically: username and password = roll number.</div>{% endif %}
  <div class="mt-3"><button class="btn btn-primary">Save</button> <a href="{{ url_for('students') }}" class="btn btn-link">Cancel</a></div>
</form></div>
{% endblock %}
