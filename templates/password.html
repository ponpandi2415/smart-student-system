{% extends "base.html" %}
{% block content %}
<div class="col-md-5">
<h4>Change password</h4>
<form method="post" class="card card-body">
  <div class="mb-3"><label class="form-label">Current password</label><input name="old" type="password" class="form-control" required></div>
  <div class="mb-3"><label class="form-label">New password</label><input name="new" type="password" class="form-control" minlength="6" required></div>
  <button class="btn btn-primary">Update</button>
</form>
</div>
{% endblock %}
